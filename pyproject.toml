[project]
name = "sar"
version = "0.1.0"
description = "Playing with SAR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asf-search>=12.2.3",
    "geopandas>=1.1.4",
    "gpxpy>=1.6.2",
    "plotly>=6.9.0",
    "sarpy>=2.0.1",
    "shapely>=2.1.2",
    "types-geopandas>=1.1.4.20260628",
    "types-shapely>=2.1.0.20260630",
]

[tool.mypy]
disable_error_code = ["import-not-found"]
